# ~/.config/tmux/tmux.conf — 最小配置（stow 包 tmux）
# 重载：prefix + r（本文件）

# ── 基础行为 ──────────────────────────────────────────────
set -g mouse on
set -g mode-keys vi
set -g history-limit 50000

# 窗口/面板编号从 1 开始，窗口关闭后自动重排（不跳号）
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── 前缀键：C-b → C-a ─────────────────────────────────────
unbind C-b
set -g prefix C-a
# 连按两次 C-a 把真实 C-a 透传给程序（readline 回行首）
bind C-a send-prefix

# ── 手感 ──────────────────────────────────────────────────
# Esc 零延迟（默认 500ms，vim 里按 Esc 会卡）
set -s escape-time 0
# 让 vim/nvim 收到 focus 事件（autoread 依赖）
set -g focus-events on
# 颜色：默认终端用 tmux-256color，真彩色透传
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'

# ── 分屏（继承当前目录）────────────────────────────────────
# prefix + | 左右分，prefix + - 上下分
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── 重载配置 ──────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"
